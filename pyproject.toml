[tool.poetry]
name = "bugcam"
version = "0.7.1"
description = "detect and classify insects on a raspberry pi"
authors = ["Deniz Aydemir <deniz@aydemir.us>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/MIT-Senseable-City-Lab/sensing-garden"
keywords = ["hailo", "raspberry-pi", "insect-detection", "insect-classification", "computer-vision", "ai", "sensing-garden", "mit", "senseable-city-lab"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Video",
]
packages = [{include = "bugcam"}]
include = ["bugcam/sensors/sen55/*", "bugcam/detection.yaml"]

[tool.poetry.dependencies]
python = "^3.11"
typer = {extras = ["all"], version = ">=0.9.0"}
rich = ">=13.0.0"
numpy = ">=1.21.0"
setproctitle = "*"
opencv-python = "*"
requests = ">=2.28.0"
pyyaml = ">=6.0"
bugspot = "^0.4.2"
flask = ">=2.0.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0.0"
pytest-mock = ">=3.0.0"

[tool.poetry.group.integration.dependencies]
# Local end-to-end testing of the Pollen upload path against a real S3
# multipart lifecycle. ministack is an in-process AWS emulator; boto3 is used
# only by the tests (the device itself uploads via presigned URLs, no SDK).
boto3 = ">=1.34.0"
ministack = ">=1.3.0"

[tool.poetry.scripts]
bugcam = "bugcam.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = [
    "integration: marks tests as integration tests (require network, may be slow)",
    "rpi: marks tests that only run on Raspberry Pi hardware",
]

[tool.ruff]
target-version = "py311"
extend-exclude = ["time-lapse"]  # standalone experiment, not part of the bugcam package

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F841"]   # `with patch(...) as m` handles are kept for the patch side-effect
"scripts/**" = ["E402"]  # helper scripts adjust sys.path before importing

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
